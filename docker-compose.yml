services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: glossy
      POSTGRES_PASSWORD: glossy
      POSTGRES_DB: glossy
    ports:
      - "5432:5432"
    volumes:
      - glossy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossy -d glossy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glossy_pg:
